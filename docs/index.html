<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球旅游动态看板 - 加载中...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }
        h1 { font-size: 2.5rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; opacity: 0.9; line-height: 1.6; }
        .spinner {
            width: 60px; height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 2rem auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .note {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(255,255,255,0.15);
            border-radius: 12px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 全球旅游动态看板</h1>
        <p>Dashboard is initializing...</p>
        <div class="spinner"></div>
        <p>The live dashboard will be generated automatically by the daily GitHub Actions workflow.</p>
        <div class="note">
            <strong>⏳ 等待首次自动运行</strong><br>
            请手动触发 GitHub Actions 工作流以生成看板，<br>
            或等待每日 09:00 UTC 的定时任务执行。
        </div>
    </div>
</body>
</html>
