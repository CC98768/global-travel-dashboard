name: Daily Travel Data Update

on:
  schedule:
    - cron: '0 6 * * *'  # 每天6:00 UTC (14:00 CST)
  workflow_dispatch:  # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      
      - name: Collect data
        run: python3 scripts/collect_data.py
      
      - name: Generate dashboard
        run: python3 scripts/generate_dashboard.py -d data/travel_daily.json -o index.html
      
      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Daily update: $(date +%Y-%m-%d)" || exit 0
          git push
